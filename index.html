<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calculator</title>
  <meta name="theme-color" content="#1f2933">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="display">
      <div id="history" class="history" aria-hidden="true"></div>
      <output id="result" class="result" aria-live="polite">0</output>
    </div>
    <div class="keys">
      <button data-action="clear" class="fn">AC</button>
      <button data-action="sign" class="fn">±</button>
      <button data-action="percent" class="fn">%</button>
      <button data-op="÷" class="op">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="×" class="op">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="−" class="op">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op">+</button>

      <button data-num="0" class="zero">0</button>
      <button data-action="dot">.</button>
      <button data-action="equals" class="eq">=</button>
    </div>
    <button id="installBtn" class="install" hidden>Install app</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
